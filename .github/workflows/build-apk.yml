
name: Build EduSpark Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -o *.zip -d extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eduspark-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/eduspark-release.jks" >> $GITHUB_ENV

      - name: Build release APK
        run: |
          cd extracted/EduSparkAndroid
          gradle --no-daemon assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK="extracted/EduSparkAndroid/app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -p -f 4 "$APK" "$RUNNER_TEMP/eduspark-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/EduSpark-release.apk" \
            "$RUNNER_TEMP/eduspark-aligned.apk"

          "$APKSIGNER" verify "$RUNNER_TEMP/EduSpark-release.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: EduSpark-Signed-Release
          path: ${{ runner.temp }}/EduSpark-release.apk
